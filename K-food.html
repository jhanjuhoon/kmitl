<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>K-food</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* layout: sticky header with two switches (ผู้สั่ง/ร้านค้า, ปกติ/น้ำท่วม); desktop = shop list beside shop detail, phone = one pane at a time.
   The mode switch re-themes the whole app: persimmon in normal mode, flood blue in emergency mode. */
:root {
  --font-head: 'Prompt', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --bg: #f6f4f1; --surface: #ffffff; --surface-2: #ece8e3;
  --fg: #221c17; --muted: #645a52; --line: #ddd6ce;
  --accent: #c9440a; --accent-fg: #ffffff; --accent-soft: #ffe8d6;
  --flood: #0b6580; --flood-fg: #ffffff; --flood-soft: #d8eef5;
  --ok: #1d6f3f; --ok-soft: #dbf0e2;
  --bad: #a82a1f; --bad-soft: #fde2df;
  --warn: #7d5300; --warn-soft: #fdf0c9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181411; --surface: #221d19; --surface-2: #2c2621;
    --fg: #f1ebe5; --muted: #b3a79c; --line: #3a332d;
    --accent: #ff9a4a; --accent-fg: #1f0e02; --accent-soft: #3d2713;
    --flood: #62c6e3; --flood-fg: #06242d; --flood-soft: #12313b;
    --ok: #6fd49a; --ok-soft: #173526;
    --bad: #ff9b92; --bad-soft: #40201d;
    --warn: #f0c25a; --warn-soft: #3a2f10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181411; --surface: #221d19; --surface-2: #2c2621;
  --fg: #f1ebe5; --muted: #b3a79c; --line: #3a332d;
  --accent: #ff9a4a; --accent-fg: #1f0e02; --accent-soft: #3d2713;
  --flood: #62c6e3; --flood-fg: #06242d; --flood-soft: #12313b;
  --ok: #6fd49a; --ok-soft: #173526;
  --bad: #ff9b92; --bad-soft: #40201d;
  --warn: #f0c25a; --warn-soft: #3a2f10;
  color-scheme: dark;
}
#app[data-mode="flood"] { --accent: var(--flood); --accent-fg: var(--flood-fg); --accent-soft: var(--flood-soft); }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
h1, h2, h3, .logo { font-family: var(--font-head); text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 12px; font-weight: 600; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 1120px; margin: 0 auto; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-block: 14px; background: var(--bg); }
@media (min-width: 821px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; } }
.brand { display: flex; flex-direction: column; min-width: 0; }
.logo { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.logo { color: var(--accent); }
.logo i { font-style: normal; color: var(--fg); }
.tag { font-size: 12.5px; color: var(--muted); }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 500; padding: 6px 14px; min-height: 36px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* flood banner */
.flood { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius, 14px); padding: 14px; margin-bottom: 16px; display: grid; gap: 10px; }
.fl-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.fl-head strong { font-family: var(--font-head); font-size: 16px; color: var(--accent); }
.pk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .pk { grid-template-columns: minmax(0, 1fr); } }
.pkchip { text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; cursor: pointer; min-width: 0; }
.pkchip b { font-size: 14px; }
.pkchip span { font-size: 12.5px; font-weight: 600; }
.pkchip small { font-size: 12px; color: var(--muted); }
.pkchip.on span { color: var(--ok); }
.pkchip.off span { color: var(--bad); }
.pkchip.off { opacity: .85; }
.fl-note { margin: 0; font-size: 13px; color: var(--muted); }

/* layout */
.main { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rows { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 820px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .main[data-view="shop"] .list { display: none; }
  .main[data-view="list"] .detail { display: none; }
}
@media (min-width: 821px) { .back { display: none !important; } }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 5px 14px; font-size: 13.5px; min-height: 34px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.row[aria-current="true"] { border-color: var(--accent); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 600; font-size: 19px; color: #fff; background: hsl(var(--h) 42% 34%); flex: none; }
.rt { display: flex; flex-direction: column; min-width: 0; }
.rt b { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 12.5px; color: var(--muted); }
.blurb { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.detail .card { padding: 0; overflow: hidden; }
.dh { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.back { justify-self: start; border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 4px 0; cursor: pointer; min-height: 32px; }
.dtitle { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.dtitle h1 { font-size: 19px; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.terms { font-size: 13.5px; color: var(--muted); margin: 0; }
.tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 500; padding: 8px 14px; min-height: 40px; border-bottom: 2px solid transparent; cursor: pointer; }
.tabs button[aria-current="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.body { padding: 16px; display: grid; gap: 12px; }
.notice { margin: 0; font-size: 13.5px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; }

.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mi { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mi:last-child { border-bottom: 0; }
.mi .mn { min-width: 0; display: flex; flex-direction: column; }
.mi b { font-weight: 500; overflow-wrap: anywhere; }
.price { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 16px; font-weight: 600; min-height: 36px; cursor: pointer; }
.stp { display: inline-flex; align-items: center; gap: 4px; }
.stp button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 18px; cursor: pointer; line-height: 1; }
.stp span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }

.cartbar { position: sticky; bottom: 12px; margin: 0 16px 16px; display: grid; gap: 8px; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 14px; }
.cb-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.cb-top span { font-variant-numeric: tabular-nums; }
.track { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 25%, transparent); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); }
.cb-hint { font-size: 12.5px; opacity: .85; }

.btn { border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; border-radius: 10px; padding: 10px 18px; min-height: 42px; cursor: pointer; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 13.5px; }

/* chat */
.thread { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px; }
.b { max-width: 84%; padding: 8px 13px; border-radius: 16px; overflow-wrap: anywhere; }
.b.mine { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
.b.other { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 5px 12px; font-size: 13px; min-height: 34px; cursor: pointer; }
.send { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.in { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; width: 100%; min-width: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* checkout */
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt span { display: flex; flex-direction: column; min-width: 0; }
.opt small { color: var(--muted); font-size: 12.5px; }
.opt.dis { opacity: .5; cursor: not-allowed; }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.grp { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.grp legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 6px; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14.5px; }
.lines li, .sum div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.sum { display: grid; gap: 4px; border-top: 1px dashed var(--line); padding-top: 10px; }
.sum .tot { font-weight: 700; font-size: 17px; }

/* orders */
.orders { display: grid; gap: 8px; }
.paybox { display: grid; gap: 8px; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
.paybox p { margin: 0; }
.ord .stat, .od .stat { margin: 8px 0 0; font-size: 14px; color: var(--fg); }
.ord .stat b, .od .stat b { color: var(--accent); }
.ord { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.ord-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.ord p { margin: 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.code { font-family: var(--font-head); font-weight: 600; letter-spacing: .12em; color: var(--accent); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.steps li { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.steps li::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 5px; }
.steps li.done::before, .steps li.now::before { background: var(--accent); }
.steps li.now { color: var(--fg); font-weight: 600; }
.sect-title { font-family: var(--font-head); font-weight: 600; font-size: 15px; margin: 0 0 8px; }

/* vendor */
.vnote { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 820px) { .vgrid { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.lbl { font-size: 13.5px; font-weight: 600; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: minmax(0, 1fr); } }
.vmenu { list-style: none; margin: 0 0 12px; padding: 0; }
.vmenu li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.vmenu li span { min-width: 0; overflow-wrap: anywhere; }
.addrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
@media (max-width: 520px) { .addrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .addrow .btn { grid-column: 1 / -1; } }
.empty { color: var(--muted); font-size: 14px; margin: 0; padding: 8px 0; }

.thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex: none; display: block; }
.thumb.sm { width: 44px; height: 44px; border-radius: 10px; }
.cover { height: 140px; display: grid; place-items: center; background: hsl(var(--h) 65% 90%); overflow: hidden; }
.cover svg { height: 100%; width: auto; max-width: 100%; }
.nav { display: flex; gap: 8px; margin: 0 0 16px; }
.nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 15px; padding: 10px 14px; min-height: 46px; border-radius: 12px; cursor: pointer; }
.nav button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.badge { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; line-height: 22px; text-align: center; }
.osec { max-width: 760px; display: grid; gap: 12px; }
.olist { display: grid; gap: 10px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.oh { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; color: inherit; padding: 12px; cursor: pointer; }
.oh .thumb { width: 56px; height: 56px; }
.oh .rt .chip { align-self: flex-start; margin-top: 4px; }
.chev { color: var(--muted); font-size: 12px; }
.od { padding: 12px 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.od p { margin: 0; }
.oitem { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.fl-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.fl-body.nomap { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 820px) { .fl-body { grid-template-columns: minmax(0, 1fr); } }
.pdet { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.pdet p { margin: 0; font-size: 13.5px; }
.pd-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pact { display: flex; flex-wrap: wrap; gap: 8px; }
.pkchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.map { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); }
.map text { font-family: var(--font-body); fill: var(--muted); font-size: 12px; }
.map .land { fill: var(--surface-2); }
.map .campus { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 6 5; }
.map .bld { fill: var(--line); }
.map .road { fill: var(--surface); stroke: var(--line); }
.map .water { fill: var(--flood); fill-opacity: .4; stroke: var(--flood); stroke-dasharray: 3 3; }
.map .shopb { fill: var(--accent-soft); stroke: var(--accent); }
.map .route { fill: none; stroke-width: 4; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; }
.map .route.ok { stroke: var(--accent); }
.map .route.bad { stroke: var(--bad); }
.map .you circle { fill: var(--fg); }
.map .you text { fill: var(--fg); font-weight: 600; }
.map .mk { cursor: pointer; }
.map .mk .ring { stroke: var(--surface); stroke-width: 2; }
.map .mk.on .ring { fill: var(--accent); }
.map .mk.off .ring { fill: var(--bad); }
.map .mk.sel .ring { stroke: var(--fg); stroke-width: 3; }
.map .mk text { font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.map .mk.on text { fill: var(--accent-fg); }
.map .mk.off text { fill: var(--bg); }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.lg { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.lg.on { background: var(--accent); }
.lg.off { background: var(--bad); }
.lg.wt { border-radius: 3px; background: var(--flood); opacity: .45; }
.lg.rt { border-radius: 0; height: 0; width: 18px; border-top: 3px dashed var(--accent); }
.vform { display: grid; gap: 4px; }
.vform .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.foot { margin-top: 28px; font-size: 12.5px; color: var(--muted); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .row, .btn, .seg button { transition: background-color .15s, border-color .15s; } }

.dinfo { display: grid; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.dinfo b { color: var(--fg); font-size: 13.5px; }

.vtabs { margin-bottom: 12px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--font-head); font-size: 22px; color: var(--accent); }
.kpi span { font-size: 12.5px; color: var(--muted); }
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';
var $app = document.getElementById('app');

  var inp = function (id, k, label, ph, type) { return '<div class="field"><label class="lbl" for="' + id + '">' + label + '</label><input id="' + id + '" class="in"' + (type ? ' type="' + type + '" min="0" inputmode="numeric"' : '') + ' data-bind="ap:' + k + '" value="' + esc(f[k]) + '" placeholder="' + ph + '" autocomplete="off"></div>'; };
  return '<main><div class="vgrid"><section class="card"><h2>สมัครเปิดร้านในแอป</h2><p class="hint">แอดมินจะตรวจข้อมูลก่อน ร้านจะขึ้นให้ลูกค้าเห็นหลังได้รับอนุมัติและมีเมนูแล้ว</p>' +
    '<form class="vform" data-form="apply">' + inp('ap-name', 'name', 'ชื่อร้าน', 'เช่น ข้าวมันไก่ ป้าสม') + inp('ap-cat', 'cat', 'ประเภทอาหาร', 'เช่น ข้าวแกง ก๋วยเตี๋ยว') + inp('ap-owner', 'owner', 'ชื่อเจ้าของร้าน', 'ชื่อ-นามสกุล') + inp('ap-phone', 'phone', 'เบอร์โทร', '08xxxxxxxx') + inp('ap-dist', 'dist', 'ร้านอยู่ห่างประตูมหาวิทยาลัย (เมตร)', 'เช่น 300', 'number') +
    '<div class="two"><div class="field"><label class="lbl" for="ap-tr">ส่งด้วย</label><select id="ap-tr" class="in" data-bind="ap:tr">' + opt('walk', 'เดิน', f.tr) + opt('bike', 'มอเตอร์ไซค์', f.tr) + opt('car', 'รถยนต์', f.tr) + '</select></div>' +
    '<div class="field"><label class="lbl" for="ap-staff">คนในร้าน</label><select id="ap-staff" class="in" data-bind="ap:staff">' + opt(1, '1 คน', f.staff) + opt(2, '2 คนขึ้นไป', f.staff) + '</select></div></div>' +
    '<div class="field"><label class="lbl" for="ap-note">หมายเหตุ (ไม่บังคับ)</label><input id="ap-note" class="in" data-bind="ap:note" value="' + esc(f.note) + '" placeholder="เช่น เวลาขาย" autocomplete="off"></div><button class="btn" type="submit">ส่งใบสมัคร</button></form></section>' +
    '<section class="card"><h2>ใบสมัครของฉัน</h2>' + (mine.length ? '<div class="orders">' + mine.map(function (a) { return appCard(a, false); }).join('') + '</div>' : '<p class="empty">ยังไม่มีใบสมัคร</p>') + '</section></div></main>';
}
function vendor() {
  return '<div class="vtabs">' + seg('vtab', [['shop', 'ร้านของฉัน'], ['apply', 'สมัครเปิดร้านใหม่']], S.vtab, 'เมนูร้านค้า') + '</div>' + (S.vtab === 'apply' ? applyView() : vendorShop());
}
function admin() {
  var pend = S.apps.filter(function (a) { return a.status === 'pending'; }), done = S.apps.filter(function (a) { return a.status !== 'pending'; });
  var kpi = function (n, l) { return '<div class="kpi"><b>' + n + '</b><span>' + l + '</span></div>'; };
  return '<main><p class="vnote">เมนูแอดมิน (ตัวอย่าง): ตรวจใบสมัคร อนุมัติ และดูแลร้านในแอป</p><div class="kpis">' + kpi(pend.length, 'รอตรวจ') + kpi(shops.filter(function (x) { return !x.sus; }).length, 'ร้านที่ใช้งาน') + kpi(shops.filter(function (x) { return x.sus; }).length, 'ร้านที่ถูกระงับ') + kpi(S.apps.filter(function (a) { return a.status === 'rejected'; }).length, 'ไม่ผ่าน') + '</div>' +
    '<div class="vgrid"><section class="card"><h2>ใบสมัครรอตรวจ (' + pend.length + ')</h2>' + (pend.length ? '<div class="orders">' + pend.map(function (a) { return appCard(a, true); }).join('') + '</div>' : '<p class="empty">ไม่มีใบสมัครที่รอตรวจ</p>') + '</section>' +
    '<section class="card"><h2>ร้านในแอป</h2><ul class="vmenu">' + shops.map(function (x) {
      return '<li><span><b>' + esc(x.name) + '</b> · ' + x.menu.length + ' เมนู ' + (x.sus ? '<span class="chip bad">ถูกระงับ</span>' : (x.menu.length ? '<span class="chip ok">ใช้งาน</span>' : '<span class="chip warn">ยังไม่มีเมนู</span>')) + '</span><button type="button" class="btn ghost sm" data-act="asus" data-id="' + x.id + '">' + (x.sus ? 'เปิดใช้งาน' : 'ระงับร้าน') + '</button></li>';
    }).join('') + '</ul></section>' +
    '<section class="card"><h2>ประวัติการตรวจ</h2>' + (done.length ? '<div class="orders">' + done.map(function (a) { return appCard(a, false); }).join('') + '</div>' : '<p class="empty">ยังไม่มี</p>') + '</section></div></main>';
}
function submitApply() {
  var f = S.ap, d = parseInt(f.dist, 10);
  if (!f.name.trim() || !f.owner.trim()) { toast('กรอกชื่อร้านและชื่อเจ้าของร้านก่อน'); return; }
  if (!f.phone.trim()) { toast('กรอกเบอร์โทรก่อน'); return; }
  if (!(d >= 0) || f.dist === '') { toast('กรอกระยะห่างจากประตูก่อน'); return; }
  S.apps.unshift({ id: S.apps.length + 1, name: f.name.trim(), cat: f.cat.trim(), owner: f.owner.trim(), phone: f.phone.trim(), dist: d, tr: f.tr, staff: parseInt(f.staff, 10) || 1, note: f.note.trim(), status: 'pending', mine: true });
  S.ap = { name: '', cat: '', owner: '', phone: '', dist: '', tr: 'walk', staff: '1', note: '' };
  toast('ส่งใบสมัครแล้ว รอแอดมินตรวจ (สลับไปมุมมองแอดมินเพื่อลองอนุมัติ)');
}
function approveApp(a) {
  var sid = 'n' + a.id + '_' + shops.length;
  shops.push({ id: sid, name: a.name, av: a.name.charAt(0), hue: (a.id * 67) % 360, cat: a.cat || 'อาหาร', dist: a.dist, fee: 10, free: 0, open: false, flood: 'ask', blurb: 'ร้านใหม่', menu: [], tr: a.tr, staff: a.staff, range: TRN[a.tr][1], rnd: a.staff >= 2 ? 15 : 30, cap: a.staff >= 2 ? 5 : 3, away: 0, sus: false });
  a.status = 'approved'; a.shopId = sid;
  toast('อนุมัติแล้ว สร้างร้าน ' + a.name + ' ให้ ร้านต้องเพิ่มเมนูก่อนลูกค้าจะเห็น');
}

function render() {
  var ae = document.activeElement;
  var fid = ae && ae.id && $app.contains(ae) ? ae.id : null;
  var selr = null;
  try { if (fid && ae.selectionStart != null) selr = [ae.selectionStart, ae.selectionEnd]; } catch (e) { selr = null; }
  $app.dataset.mode = S.mode;
  $app.innerHTML = header() + (S.role === 'customer' ? banner() : '') + (S.role === 'customer' ? customer() : (S.role === 'vendor' ? vendor() : admin())) + '<p class="foot">ต้นแบบเพื่อสาธิตแนวคิด ข้อมูลร้าน เมนู ราคา และสถานะจุดรับอาหารเป็นตัวอย่าง ไม่ใช่ข้อมูลจริง</p>';
  if (fid) {
    var n = document.getElementById(fid);
    if (n) { n.focus(); if (selr && n.setSelectionRange) { try { n.setSelectionRange(selr[0], selr[1]); } catch (e) {} } }
  }
  var ths = $app.querySelectorAll('.thread');
  for (var i = 0; i < ths.length; i++) ths[i].scrollTop = ths[i].scrollHeight;
}

/* ---------- พฤติกรรม ---------- */
function botReply(s, text) {
  var flood = S.mode === 'flood';
  var reply, follow = null;
  if (!s.open) reply = 'ตอนนี้ร้านปิดอยู่ค่ะ เปิดอีกครั้ง 16:00 ทักไว้ได้เลยนะคะ';
  else if (/จุดรับ/.test(text)) reply = 'ส่งไปที่จุดรับอาหารให้ได้ค่ะ เลือกจุดรับตอนชำระเงินได้เลย แล้วรับด้วยรหัสที่ระบบให้';
  else if (/ท่วม|ส่ง|หอ|อาคาร/.test(text)) {
    if (flood) {
      if (canDeliverFlood(s)) reply = 'ส่งได้ค่ะ ถนนหน้าหอยังผ่านได้ ส่งถึงหน้าอาคารนะคะ';
      else if (s.flood === 'no') reply = 'ขอโทษนะคะ ตอนนี้น้ำท่วมส่งถึงที่ไม่ได้ แต่ร้านนำไปส่งที่จุดรับอาหารให้ได้ค่ะ';
      else { reply = 'ขอเช็กเส้นทางก่อนนะคะ รอสักครู่'; follow = 'เช็กแล้วค่ะ ส่งถึงที่ได้ สั่งได้เลยนะคะ'; }
    } else reply = 'ส่งได้ค่ะ ' + termsText(s) + ' ร้านออกส่งเป็นรอบ รอบถัดไป ' + hm(nextRound(s).t);
  } else if (/เมนู|แนะนำ|อะไร/.test(text)) reply = 'วันนี้แนะนำ' + (s.menu[0] || { name: 'เมนูของร้าน' }).name + 'ค่ะ';
  else reply = 'รับทราบค่ะ ใส่หมายเหตุไว้ให้แล้ว';
  setTimeout(function () {
    thread(s.id).push({ who: 'shop', text: reply }); render();
    if (follow) {
      setTimeout(function () { thread(s.id).push({ who: 'shop', text: follow }); S.confirmed[s.id] = true; render(); }, 2200);
    }
  }, 800);
}
function sendChat(who) {
  var key = who === 'cust' ? 'draft' : 'vdraft';
  var text = S[key].trim();
  if (!text) return;
  var s = who === 'cust' ? shop(S.shopId) : shop(S.vs);
  thread(s.id).push({ who: who, text: text });
  S[key] = '';
  render();
  if (who === 'cust') botReply(s, text);
}
function addItem() {
  var name = S.nname.trim(), price = parseInt(S.nprice, 10);
  if (!name || !(price > 0)) { toast('กรอกชื่อเมนูและราคาก่อน'); return; }
  shop(S.vs).menu.push({ id: S.vs + 'm' + (uid++), name: name, price: price, kind: S.nkind, img: S.nimg });
  S.nname = ''; S.nprice = ''; S.nimg = ''; S.nimgName = '';
  toast('เพิ่มเมนูแล้ว ผู้สั่งเห็นทันที');
  render();
}
function autoAdvance(o) {
  var t = setInterval(function () {
    if (o.status >= 3) { clearInterval(t); return; }
    o.status++;
    toast('ออเดอร์ #' + o.id + ' ' + stepLabels(o.method)[o.status]);
    render();
  }, 7000);
}
function placeOrder() {
  var s = shop(S.shopId), ls = lines(s), sub = subtotal(s);
  if (!ls.length) { toast('เลือกเมนูก่อนนะ'); return; }
  if (!s.open) { toast('ร้านปิดอยู่'); return; }
  if (closedAll()) { toast('ปิดรับออเดอร์ชั่วคราว ไม่มีจุดรับอาหารที่ปลอดภัย'); return; }
  var m = effMethod(s), pt = effPoint();
  if (m === 'delivery' && !S.co.addr.trim()) { toast('กรอกชั้น ห้อง หรือจุดสังเกตที่ให้ไปส่งก่อน'); return; }
  var D = m === 'delivery' ? deliv(s, S.co.zone) : null;
  if (D && !D.ok) { toast(D.why); return; }
  var nr = D ? nextRound(s) : null;
  if (S.co.pay === 'transfer' && !S.co.slip) { toast('แนบสลิปโอนเงินก่อน'); return; }
  var fee = feeFor(s, sub, m);
  var o = {
    id: S.seq++, shopId: s.id, mine: true, cust: 'ผู้สั่ง',
    items: ls.map(function (l) { return { name: l.name, qty: l.qty, price: l.price, kind: l.kind, img: l.img }; }),
    sub: sub, fee: fee, total: sub + fee, method: m, addr: m === 'delivery' ? zname(S.co.zone) + ' · ' + S.co.addr.trim() : S.co.addr.trim(), dist: D ? D.d : 0, one: D ? D.one : 0, rk: nr ? nr.t : null,
    point: m === 'point' ? pt : null, code: m === 'point' ? String(1000 + Math.floor(Math.random() * 9000)) : null,
    pay: S.co.pay, slip: S.co.pay === 'transfer' ? S.co.slip : '', paid: false, status: 0
  };
  S.orders.unshift(o); S.co.slip = ''; autoAdvance(o);
  S.cart[s.id] = {}; S.tab = 'menu'; S.view = 'list'; S.sec = 'orders'; S.openOrder = o.id;
  toast('สั่งแล้ว ร้านได้รับออเดอร์ #' + o.id);
  render();
}

$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (a === 'role') { S.role = v; }
  else if (a === 'mode') { S.mode = v; S.co.method = null; }
  else if (a === 'filter') { S.filter = v; }
  else if (a === 'open') { S.shopId = id; S.view = 'shop'; S.tab = 'menu'; S.co.method = null; }
  else if (a === 'back') { S.view = 'list'; }
  else if (a === 'tab') { S.tab = v; }
  else if (a === 'inc' || a === 'dec') {
    var c = S.cart[S.shopId] || (S.cart[S.shopId] = {});
    c[id] = Math.max(0, (c[id] || 0) + (a === 'inc' ? 1 : -1));
  }
  else if (a === 'place') { placeOrder(); return; }
  else if (a === 'quick') { S.draft = b.dataset.text; sendChat('cust'); return; }
  else if (a === 'pick') { S.sel = id; }
  else if (a === 'ptoggle') { var pp = pickups.filter(function (x) { return x.id === id; })[0]; pp.open = !pp.open; }
  else if (a === 'usepoint') { S.co.point = id; S.co.method = 'point'; toast('เลือกจุดรับอาหาร ' + id + ' ไว้ให้ที่หน้าชำระเงินแล้ว'); }
  else if (a === 'map') { S.showMap = !S.showMap; }
  else if (a === 'sec') { S.sec = v; }
  else if (a === 'oopen') { var oid = Number(id); S.openOrder = S.openOrder === oid ? null : oid; }
  else if (a === 'viewshop') { S.sec = 'shops'; S.shopId = id; S.view = 'shop'; S.tab = 'menu'; S.co.method = null; }
  else if (a === 'nclear') { S.nimg = ''; S.nimgName = ''; }
  else if (a === 'vopen') { shop(S.vs).open = v === '1'; }
  else if (a === 'vdel') { var s1 = shop(S.vs); s1.menu = s1.menu.filter(function (m) { return m.id !== id; }); }
  else if (a === 'vpaid') { var o2 = S.orders.filter(function (x) { return String(x.id) === id; })[0]; if (o2) o2.paid = true; }
  else if (a === 'vtab') { S.vtab = v; }
  else if (a === 'aok') { var ap1 = S.apps.filter(function (x) { return String(x.id) === id; })[0]; if (ap1 && ap1.status === 'pending') approveApp(ap1); }
  else if (a === 'ano') { var ap2 = S.apps.filter(function (x) { return String(x.id) === id; })[0]; var rj = document.getElementById('rj-' + id); if (ap2) { ap2.status = 'rejected'; ap2.reason = rj ? rj.value : REASONS[0]; toast('ปฏิเสธใบสมัครแล้ว'); } }
  else if (a === 'asus') { var sx = shop(id); sx.sus = !sx.sus; if (sx.sus && S.shopId === id) { var f1 = shops.filter(passFilter)[0]; if (f1) S.shopId = f1.id; } toast(sx.sus ? 'ระงับร้านแล้ว ลูกค้าไม่เห็นร้านนี้' : 'เปิดใช้งานร้านแล้ว'); }
  else if (a === 'vgo') {
    var sv = shop(S.vs), ps = S.orders.filter(function (x) { return x.shopId === S.vs && x.method === 'delivery' && x.status < 3; });
    if (!ps.length) { toast('ยังไม่มีออเดอร์ที่ต้องส่ง'); return; }
    sv.away = Date.now() + (tripMin(sv, Math.max.apply(null, ps.map(function (x) { return x.dist; }))) + (ps.length - 1) * 2) * 60000;
    toast('ออกส่งแล้ว ลูกค้าเห็นว่าร้านจะกลับ ' + hm(sv.away));
  }
  else if (a === 'vback') { shop(S.vs).away = 0; toast('กลับถึงร้านแล้ว'); }
  else if (a === 'vadvance') { var o = S.orders.filter(function (x) { return String(x.id) === id; })[0]; if (o && o.status < 3) o.status++; }
  render();
});
$app.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target.dataset.form;
  if (f === 'chat') sendChat('cust');
  else if (f === 'vchat') sendChat('shop');
  else if (f === 'vadd') addItem();
  else if (f === 'apply') submitApply();
});
function bind(e, isChange) {
  var t = e.target, k = t.dataset && t.dataset.bind;
  if (!k) return;
  var choice = t.type === 'radio' || t.type === 'file' || t.tagName === 'SELECT';
  if (choice !== isChange) return;
  if (k.indexOf('ap:') === 0) { S.ap[k.slice(3)] = t.value; return; }
  var s1 = shop(S.vs);
  if (k === 'draft') S.draft = t.value;
  else if (k === 'vdraft') S.vdraft = t.value;
  else if (k === 'addr') S.co.addr = t.value;
  else if (k === 'nname') S.nname = t.value;
  else if (k === 'nprice') S.nprice = t.value;
  else if (k === 'vfee') s1.fee = Math.max(0, parseInt(t.value, 10) || 0);
  else if (k === 'vfree') s1.free = Math.max(0, parseInt(t.value, 10) || 0);
  else if (k === 'vflood') { s1.flood = t.value; delete S.confirmed[S.vs]; }
  else if (k === 'vs') { S.vs = t.value; render(); }
  else if (k === 'zone') { S.co.zone = t.value; render(); }
  else if (k === 'vtr') { s1.tr = t.value; s1.range = TRN[t.value][1]; render(); }
  else if (k === 'vstaff') { s1.staff = parseInt(t.value, 10) || 1; render(); }
  else if (k === 'vrange') { s1.range = Math.max(0, parseInt(t.value, 10) || 0); render(); }
  else if (k === 'vrnd') { s1.rnd = parseInt(t.value, 10) || 15; render(); }
  else if (k === 'vcap') { s1.cap = Math.max(1, parseInt(t.value, 10) || 1); render(); }
  else if (k === 'method') { S.co.method = t.value; render(); }
  else if (k === 'point') { S.co.point = t.value; render(); }
  else if (k === 'nkind') { S.nkind = t.value; }
  else if (k === 'nimg') {
    var f = t.files && t.files[0];
    if (!f) { S.nimg = ''; S.nimgName = ''; render(); }
    else if (f.size > 3000000) { toast('รูปใหญ่เกิน 3 MB ลองรูปที่เล็กลง'); }
    else { var fr = new FileReader(); fr.onload = function () { S.nimg = String(fr.result); S.nimgName = f.name; render(); }; fr.readAsDataURL(f); }
  }
  else if (k === 'pay') { S.co.pay = t.value; render(); }
  else if (k === 'slip') { S.co.slip = t.files && t.files[0] ? t.files[0].name : ''; render(); }
}
$app.addEventListener('input', function (e) { bind(e, false); });
$app.addEventListener('change', function (e) { bind(e, true); });

$app.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) {
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});
render();
})();
</script>

</body></html>
